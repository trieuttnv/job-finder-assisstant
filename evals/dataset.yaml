# The evaluation dataset (README Task 3, Steps 1-2): 30 interviewer questions, 6 per category,
# 20 dev and 10 held-out. Drafted by Claude Code (Opus 5.5) from the reviewed Entries on
# 2026-10-04; every item stays `verified: false` until the Subject checks its Gold Label, and the
# evaluation refuses to run on an unverified item.
#
# expect            answer | fallback ("That isn't in my sources." or "I couldn't put together a
#                   verified answer.")
# gold.entryIds     Entries a correct answer cites (a bullet's role and a Conflict's other side
#                   also count as correct citations).
# gold.mustContain  term groups; every group needs one of its terms. For an ambiguous item, one
#                   group per main candidate.
# gold.mustNotClaim regular expressions; any match is a hallucination. Each matches a positive
#                   claim only, so an honest correction ("13, not 50") never matches.
# rewordOf          the item this one rewords, for the consistency metric.
# kind              adversarial items only: exaggeration | fabrication | recombination |
#                   out-of-scope | injection.
#
# The scorer matches terms and patterns against the shown claims only, never against text code
# writes (a Conflict notice, a fallback message). Terms match in any case, as whole words: not
# next to another letter or digit, so "4%" and "15+" match as written.

# CV-direct: one fact, straight from the CV.

- id: q01
  split: dev
  category: cv-direct
  question: "When did you work at Atlassian?"
  expect: answer
  gold:
    entryIds: [cv.role.atlassian]
    mustContain: [["2014", "Sep 2014", "September 2014"], ["2015", "Jul 2015", "July 2015"]]
    mustNotClaim: ["(?i)atlassian[^.]{0,60}\\b(2013|2016|2017)\\b"]
  verified: true
- id: q02
  split: dev
  category: cv-direct
  question: "How big did your team at Tamara grow?"
  expect: answer
  gold:
    entryIds: [cv.role.tamara.b5, cv.strengths.people]
    mustContain: [["13", "thirteen"]]
    mustNotClaim: ["(?<!n't )(?<!not )(?<!never )\\b(?:grew|led|managed|had)\\b(?:(?!\\b(?:not|never|no|didn't|haven't|wasn't)\\b)[^.]){0,30}\\b(?:1[4-9]|[2-9]\\d|\\d{3,})\\s+(?:engineers|people|reports)"]
  verified: true
- id: q03
  split: dev
  category: cv-direct
  question: "How many engineers did you manage at Tamara?"
  expect: answer
  gold:
    entryIds: [cv.role.tamara.b5, cv.strengths.people]
    mustContain: [["13", "thirteen"]]
    mustNotClaim: ["(?<!n't )(?<!not )(?<!never )\\b(?:grew|led|managed|had)\\b(?:(?!\\b(?:not|never|no|didn't|haven't|wasn't)\\b)[^.]){0,30}\\b(?:1[4-9]|[2-9]\\d|\\d{3,})\\s+(?:engineers|people|reports)"]
  rewordOf: q02
  verified: true
- id: q04
  split: dev
  category: cv-direct
  question: "Where are you based?"
  expect: answer
  gold:
    entryIds: [cv.contact]
    mustContain: [["Germany"]]
    mustNotClaim: ["(?i)\\bI(?:'m| am)\\s+(?:a\\s+)?German\\b", "(?i)(?<!n't )(?<!not )(?<!never )\\b(?:have|hold)\\s+(?:German|EU)\\s+citizenship\\b"]
  verified: true
- id: q05
  split: heldout
  category: cv-direct
  question: "What degree do you have?"
  expect: answer
  gold:
    entryIds: [cv.education]
    mustContain: [["Bachelor"], ["Computer Science"]]
    mustNotClaim: ["(?i)\\b(master'?s?|phd|doctorate|mba|msc)\\b"]
  verified: true
- id: q06
  split: heldout
  category: cv-direct
  question: "By how much did you improve the payment success rate at Alipay?"
  expect: answer
  gold:
    entryIds: [cv.role.alipay-2017.b4]
    mustContain: [["4%", "4 percent", "four percent"]]
    mustNotClaim: ["(?<!n't )(?<!not )(?<!never )\\b(?:improved|raised|increased)\\b(?:(?!\\b(?:not|never|no|didn't|haven't|wasn't)\\b)[^.]){0,50}\\b(?:[5-9]|[1-9]\\d)\\s*(?:%|percent)"]
  verified: true

# Multi-source: needs the CV and the learning repository together.

- id: q07
  split: dev
  category: multi-source
  question: "What languages do you write code in?"
  expect: answer
  gold:
    entryIds: [cv.skills.languages]
    mustContain: [["Java"]]
    mustNotClaim: ["\\b(?:expert in|years of experience (?:in|with)|professional experience (?:in|with)|professionally (?:in|with))\\s+Go\\b", "(?<!n't )(?<!not )(?<!never )\\b(?:wrote|write|used|use|built|shipped)\\b[^.]{0,20}\\bGo\\b(?:(?!\\b(?:not|never|no|didn't|haven't|wasn't)\\b)[^.]){0,30}\\b(?i:at|for)\\s+(?i:(?:Tamara|Alipay|Atlassian|123Pay|VNG|Pebg))\\b"]
  verified: true
- id: q08
  split: dev
  category: multi-source
  question: "Which programming languages do you use?"
  expect: answer
  gold:
    entryIds: [cv.skills.languages]
    mustContain: [["Java"]]
    mustNotClaim: ["\\b(?:expert in|years of experience (?:in|with)|professional experience (?:in|with)|professionally (?:in|with))\\s+Go\\b", "(?<!n't )(?<!not )(?<!never )\\b(?:wrote|write|used|use|built|shipped)\\b[^.]{0,20}\\bGo\\b(?:(?!\\b(?:not|never|no|didn't|haven't|wasn't)\\b)[^.]){0,30}\\b(?i:at|for)\\s+(?i:(?:Tamara|Alipay|Atlassian|123Pay|VNG|Pebg))\\b"]
  rewordOf: q07
  verified: true
- id: q09
  split: dev
  category: multi-source
  question: "What experience do you have with event-driven systems and Kafka?"
  expect: answer
  gold:
    entryIds: [cv.skills.languages, cv.role.tamara.b3]
    mustContain: [["event-driven", "event driven"], ["Kafka"]]
    mustNotClaim: ["(?<!n't )(?<!not )(?<!never )\\b(?:used|ran|built|operated|ran)\\b[^.]{0,30}\\bKafka\\b(?:(?!\\b(?:not|never|no|didn't|haven't|wasn't)\\b)[^.]){0,30}\\b(?:at|for)\\s+(?:Tamara|Alipay|Atlassian|123Pay|VNG|Pebg)\\b", "\\b(?:at|for)\\s+(?:Tamara|Alipay|Atlassian|123Pay|VNG|Pebg)\\b,?\\s+I\\s+(?:used|ran|built|operated)\\b[^.]{0,30}\\bKafka\\b"]
  verified: true
- id: q10
  split: dev
  category: multi-source
  question: "Have you used Go?"
  expect: answer
  gold:
    entryIds: [gh-learn.kafka.go-module, gh-learn.outbox.go-module]
    mustContain: [["Go", "Golang"], ["prototype", "prototypes", "learning"]]
    mustNotClaim: ["\\b(?:expert in|years of experience (?:in|with)|professional experience (?:in|with)|professionally (?:in|with))\\s+Go\\b", "(?<!n't )(?<!not )(?<!never )\\b(?:wrote|write|used|use|built|shipped)\\b[^.]{0,20}\\bGo\\b(?:(?!\\b(?:not|never|no|didn't|haven't|wasn't)\\b)[^.]){0,30}\\b(?i:at|for)\\s+(?i:(?:Tamara|Alipay|Atlassian|123Pay|VNG|Pebg))\\b"]
  verified: true
- id: q11
  split: heldout
  category: multi-source
  question: "How do you make sure an event is published when the database write commits?"
  expect: answer
  gold:
    entryIds: [cv.role.tamara.b3, gh-learn.outbox.summary, gh-learn.outbox.idempotency, cv.strengths.distributed-systems, cv.skills.resilience]
    mustContain: [["outbox"]]
    mustNotClaim: ["(?i)(?<!n't )(?<!not )(?<!never )\\b(?:guarantees?|provides?|achieves?|gives?)\\s+exactly[- ]once delivery"]
  verified: true
- id: q12
  split: heldout
  category: multi-source
  question: "What is your experience with idempotency?"
  expect: answer
  gold:
    entryIds: [cv.role.tamara.b3, gh-learn.kafka.idempotency, gh-learn.outbox.idempotency, cv.strengths.distributed-systems, cv.skills.resilience]
    mustContain: [["idempotency", "idempotent"]]
    mustNotClaim: []
  verified: false

# Ambiguous: no single right answer; a correct answer gives the main candidates, each cited.

- id: q13
  split: dev
  category: ambiguous
  question: "Tell me about your biggest project."
  expect: answer
  gold:
    entryIds: [cv.role.tamara.b1, cv.role.vng.b1, cv.summary.s5]
    mustContain: [["card", "cards"], ["payment gateway", "123Pay"]]
    mustNotClaim: ["(?i)\\bmy (?:biggest|largest) (?:project|thing) (?:is|was)\\b"]
  verified: true
- id: q14
  split: dev
  category: ambiguous
  question: "What is the largest thing you have built?"
  expect: answer
  gold:
    entryIds: [cv.role.tamara.b1, cv.role.vng.b1, cv.summary.s5]
    mustContain: [["card", "cards"], ["payment gateway", "123Pay"]]
    mustNotClaim: ["(?i)\\bmy (?:biggest|largest) (?:project|thing) (?:is|was)\\b"]
  rewordOf: q13
  verified: false
- id: q15
  split: dev
  category: ambiguous
  question: "Tell me about your leadership experience."
  expect: answer
  gold:
    entryIds: [cv.strengths.people, cv.role.tamara.b5, cv.role.alipay-2017.b3, cv.role.vng.b2]
    mustContain: [["Tamara"], ["Alipay"]]
    mustNotClaim: ["(?<!n't )(?<!not )(?<!never )\\b(?:grew|led|managed|had)\\b(?:(?!\\b(?:not|never|no|didn't|haven't|wasn't)\\b)[^.]){0,30}\\b(?:1[4-9]|[2-9]\\d|\\d{3,})\\s+(?:engineers|people|reports)"]
  verified: false
- id: q16
  split: dev
  category: ambiguous
  question: "What is your role?"
  expect: answer
  gold:
    entryIds: [cv.headline, cv.role.tamara]
    mustContain: [["Engineering Manager"], ["Tamara"]]
    mustNotClaim: ["(?<!n't )(?<!not )(?<!never )\\b(?:I am|I'm|I was|as)\\s+(?:a\\s+|the\\s+)?(?:CTO|VP|Director|Head of)\\b", "(?i)\\b(?:currently|still)\\b[^.]{0,40}\\bTamara\\b"]
  verified: true
- id: q17
  split: heldout
  category: ambiguous
  question: "What have you done in fraud?"
  expect: answer
  gold:
    entryIds: [cv.strengths.fraud-risk, cv.role.vng.b4, cv.role.alipay-2015.b2]
    mustContain: [["Decision Management", "123Pay"], ["ThreatMatrix", "Alipay"]]
    mustNotClaim: []
  verified: true
- id: q18
  split: heldout
  category: ambiguous
  question: "Tell me about your architecture work."
  expect: answer
  gold:
    entryIds: [cv.role.tamara.b4, cv.role.alipay-2017.b2]
    mustContain: [["card", "Tamara"], ["integration", "Alipay"]]
    mustNotClaim: []
  verified: true

