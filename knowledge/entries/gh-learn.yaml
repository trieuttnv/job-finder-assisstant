# learn-outbox: transactional outbox

- id: gh-learn.outbox.title
  type: project
  source: gh-learn
  quote: "Transactional Outbox Prototype (`learn-outbox`)"
- id: gh-learn.outbox.summary
  type: project
  source: gh-learn
  quote: "A service must atomically commit an order to Postgres **and** guarantee an `OrderCreated` event reaches Kafka, with no distributed transaction between the two systems. This is a rig that makes the three irreducible tensions measurable:"
- id: gh-learn.outbox.go-module
  type: project
  source: gh-learn
  quote: "module learn-outbox go 1.23"
- id: gh-learn.outbox.go-build
  type: project
  source: gh-learn
  quote: "Go 1.23 only if building or testing outside Docker"
- id: gh-learn.outbox.claim-modes
  type: project
  source: gh-learn
  quote: "`skip-locked` is the recommended default; `lease` when broker latency is high."
- id: gh-learn.outbox.idempotency
  type: project
  source: gh-learn
  quote: "Outbox makes the database write atomic; it does not make delivery exactly-once."
- id: gh-learn.outbox.cdc
  type: project
  source: gh-learn
  quote: "**CDC comparison** — reading the WAL removes the poll query but not the duplicates, and trades query tuning for replication-slot management."
- id: gh-learn.outbox.partial-index
  type: project
  source: gh-learn
  quote: "**Partial index `(id) WHERE published_at IS NULL`** is the crux: its size is O(backlog), not O(table)."
- id: gh-learn.outbox.cursor-hazard
  type: project
  source: gh-learn
  quote: "A relay must therefore never track a high-water-mark cursor (`WHERE id > last_seen`) — that silently skips events."
- id: gh-learn.outbox.report-lost
  type: project
  source: gh-learn
  quote: "**Generated At:** `2026-09-12T09:36:16Z` **Lost events:** `0` → ✅ PASS"
- id: gh-learn.outbox.report-slo
  type: project
  source: gh-learn
  quote: "SLO: p99 commit-to-publish latency `< 2s`."
- id: gh-learn.outbox.report-latency
  type: project
  source: gh-learn
  quote: "| Overall | `0.189s` | `0.281s` | `0.294s` | `0.302s` | ✅ PASS |"
