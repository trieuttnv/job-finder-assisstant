# Entries of Source `gh-learn` (knowledge/sources/gh-learn/). Drafted by Claude Code (Opus 5.5) from
# the Snapshot on 2026-10-04; every Entry is reviewed by the Subject.
# Both prototypes are learning projects from 2026, written in Go: one Entry per stated design
# point, measured result or language fact. Quotes are word for word from the copied files.

# learn-kafka: Kafka order-event fanout

- id: gh-learn.kafka.title
  type: project
  source: gh-learn
  quote: "Kafka Order Event Fanout Prototype"
- id: gh-learn.kafka.summary
  type: project
  source: gh-learn
  quote: "A runnable local demonstration of Kafka fanout: one `OrderStatusChanged` topic feeds four independent consumer groups with deliberately different latency, batching, ordering, and failure characteristics."
- id: gh-learn.kafka.go-module
  type: project
  source: gh-learn
  quote: "module learn-kafka go 1.23"
- id: gh-learn.kafka.go-build
  type: project
  source: gh-learn
  quote: "No local Kafka, Postgres, or Go installation is required to run the containers. Go is only needed to build the binary outside Docker."
- id: gh-learn.kafka.isolation
  type: project
  source: gh-learn
  quote: "All four consumers read the same 20-partition `order-status-changed.v1` topic but use separate consumer groups. A slow or stopped group builds only its own lag; it does not move the committed offsets of another group."
- id: gh-learn.kafka.ordering
  type: project
  source: gh-learn
  quote: "Kafka preserves record order inside a partition, not across the whole topic. The producer keys every event by `customer_id`, so all of a customer's events map to one partition."
- id: gh-learn.kafka.partitions
  type: project
  source: gh-learn
  quote: "Twenty partitions are deliberate: fraud can process roughly 5 events/sec per partition because of its 200 ms call, giving about 100 events/sec total."
- id: gh-learn.kafka.idempotency
  type: project
  source: gh-learn
  quote: "replayed records are harmless because Postgres enforces `UNIQUE (order_id, status)` and the insert uses `ON CONFLICT DO NOTHING`."
- id: gh-learn.kafka.unsafe-demo
  type: project
  source: gh-learn
  quote: "`make unsafe-demo` is intentionally unsafe: it commits the offset before writing to Postgres and then crashes."
