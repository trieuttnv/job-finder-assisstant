# Core Strengths

- id: cv.strengths.distributed-systems
  type: summary
  source: cv
  quote: "Hands-on Distributed Systems Engineering: Builds distributed payment systems for high throughput and low latency with Java, Spring Boot, MySQL, RabbitMQ, and Redis on AWS/GCP. Uses idempotency, outbox, distributed locks, and circuit breakers to keep money flows correct under failure."
- id: cv.strengths.card-issuing
  type: summary
  source: cv
  quote: "Card Issuing: Card issuing and processing end-to-end: onboarding, KYC, underwriting, authorization, billing, repayment, settlement, and reconciliation."
- id: cv.strengths.payment-processing
  type: summary
  source: cv
  quote: "Payment Processing: Integrated 100+ banks and card networks, including Visa, Mastercard, and Cybersource. Deep understanding of the end-to-end credit card processing flow."
- id: cv.strengths.platform-architecture
  type: summary
  source: cv
  quote: "Payment & Card Platform Architecture: Designs payment gateways and card platforms end-to-end, from high-level architecture to service design and transaction flows. Drives RFCs and Buy vs Build ADRs."
- id: cv.strengths.fraud-risk
  type: summary
  source: cv
  quote: "Fraud, Risk & Compliance: Built a fraud Decision Management system from scratch at 123Pay and led the fraud detection migration from ThreatMatrix to Cybersource at Alipay. Hands-on with card tokenization and PCI-DSS compliance across SEA and GCC markets."
- id: cv.strengths.stakeholders
  type: summary
  source: cv
  quote: "Stakeholder & Partner Management: Negotiates scope, priorities, and release timelines directly with engineering, business, and external partners such as banks, Visa, Mastercard, and Cybersource, turning ambiguous requirements into a real product."
- id: cv.strengths.people
  type: summary
  source: cv
  quote: "People Leadership & Team Building: Built engineering teams from the ground up three times: 123Pay, Alipay Vietnam (to 13 engineers), and Tamara (1 to 13). Owns the full management cycle: hiring, 1:1 coaching, performance reviews, promotions, and managing underperformance through to termination."

# Tamara, Oct 2022 – Sep 2026

- id: cv.role.tamara
  type: role
  source: cv
  employer: Tamara
  title: Engineering Manager
  start: 2022-10
  end: 2026-09
  quote: "Engineering Manager Oct 2022 – Sep 2026 Tamara (Fintech, Series C, first Saudi Arabia Unicorn) · Berlin, Germany"
- id: cv.role.tamara.b1
  type: bullet
  parent: cv.role.tamara
  source: cv
  quote: "Built two card products from scratch: Developed the Tamara BNPL Card and Tamara Credit Card entirely from zero, with no initial team or requirements. The system was designed for 60M DAU with ~500ms response time."
- id: cv.role.tamara.b2
  type: bullet
  parent: cv.role.tamara
  source: cv
  quote: "Managed whole card lifecycle: Customer onboarding, KYC, underwriting (credit bureau check, affordability, risk scoring, credit limit), regulatory check, contract, card issuance, authorization, billing, settlement."
- id: cv.role.tamara.b3
  type: bullet
  parent: cv.role.tamara
  source: cv
  quote: "Hands-on engineering: Designed and implemented distributed microservices and event-driven systems on AWS/GCP using Java, Spring Boot, MySQL, RabbitMQ, and Redis. Applied idempotency, outbox pattern, Redis distributed locks, retry, circuit breaker, and rate limiting."
- id: cv.role.tamara.b4
  type: bullet
  parent: cv.role.tamara
  source: cv
  quote: "End-to-end architecture: Led the architecture design across card processing, authorization, billing, repayment, fraud, accounting, and loan management. Owned it from high-level design to detailed service design and end-to-end transaction flows, with no existing architecture to build on. Evaluated trade-offs across scalability, latency, reliability, resiliency, and future extensibility."
- id: cv.role.tamara.b5
  type: bullet
  parent: cv.role.tamara
  source: cv
  quote: "Team & people: Grew the BNPL Card team from 1 to a peak of 13 engineers alongside 1 to 4 Product Managers. Hiring, onboarding, 1:1 coaching, performance reviews, promotions, and termination."
- id: cv.role.tamara.b6
  type: bullet
  parent: cv.role.tamara
  source: cv
  quote: "Domain boundaries & Buy vs Build: Defined domain boundaries and service responsibilities with senior EMs and Tech Leads, and drove RFCs on APIs, data ownership, and integration patterns. Wrote Buy vs Build analyses covering time-to-market, scalability, operational complexity, vendor dependency, customization, and maintainability."
- id: cv.role.tamara.b7
  type: bullet
  parent: cv.role.tamara
  source: cv
  quote: "Production operations: Staged rollouts, monitoring, and on-call. Worked with SRE on production incidents and defined SLOs and SLIs."
- id: cv.role.tamara.b8
  type: bullet
  parent: cv.role.tamara
  source: cv
  quote: "Goal-setting: Drove the OKR process for the BNPL Card team, setting quarterly objectives and individual target agreements aligned with delivery priorities."
- id: cv.role.tamara.b9
  type: bullet
  parent: cv.role.tamara
  source: cv
  quote: "Stakeholder alignment: Partnered with Product and business to define business flows, prioritise requirements, and renegotiate scope and timelines when requirements were ambiguous."
- id: cv.role.tamara.b10
  type: bullet
  parent: cv.role.tamara
  source: cv
  quote: "AI-first engineering: Used Cursor daily for coding and code review, and introduced AI-assisted development practices to the team."

