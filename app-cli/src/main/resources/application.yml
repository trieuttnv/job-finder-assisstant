# Environment variable names match .env.example; defaults match the README's Configuration table.
spring:
  main:
    banner-mode: off
    log-startup-info: false
    web-application-type: none

logging:
  level:
    root: WARN
    # Lucene suggests the incubating Vector API; BM25 over a few dozen Entries doesn't need it.
    org.apache.lucene.internal.vectorization: ERROR
    # A failed ingest check is reported once, by KnowledgeFailureAnalyzer, not also as a WARN.
    org.springframework.context.annotation.AnnotationConfigApplicationContext: ERROR

assistant:
  model:
    provider: ${MODEL_PROVIDER:anthropic}
    id: ${MODEL_ID:claude-sonnet-5-5}
    # The secret only ever comes from the environment (.env). Unset, startup warns and every
    # question gets the fixed unavailable message instead of failing to start.
    api-key: ${ANTHROPIC_API_KEY:}
    base-url: ${ANTHROPIC_BASE_URL:}
    timeout: ${MODEL_TIMEOUT_MS:20000}ms
    max-output-tokens: ${MODEL_MAX_OUTPUT_TOKENS:800}
  retrieval:
    top-k: ${RETRIEVAL_TOP_K:6}
    # Provisional until the dev split exists (ticket 09): just above unrelated questions' scores.
    min-score: ${RETRIEVAL_MIN_SCORE:0.5}
  guard:
    max-drop-ratio: ${GUARD_MAX_DROP_RATIO:0.5}
  prompt:
    version: ${PROMPT_VERSION:answer-v1}
    dir: prompts
  knowledge-dir: ${KNOWLEDGE_DIR:knowledge}
  trace-dir: ${TRACE_DIR:traces}
  state-dir: ${STATE_DIR:.state}
