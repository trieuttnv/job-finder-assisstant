<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" width="1100" height="700" font-family="Helvetica, Arial, sans-serif">
<title>Evaluation loop</title>
<defs>
<filter id="sh" x="-10%" y="-10%" width="130%" height="140%"><feDropShadow dx="2" dy="2" stdDeviation="1.5" flood-opacity=".25"/></filter>
<marker id="ah" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#888"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#D7592F"/></marker>
</defs>
<rect x="1.5" y="1.5" width="1097" height="697" fill="#FFFEF9" stroke="#D4A017" stroke-width="3"/>
<text x="550.0" y="52" font-size="30" font-weight="bold" fill="#111" text-anchor="middle">Evaluation loop</text>
<g id="zones">
</g>
<g id="edges">
<path d="M250,225 L300,225" fill="none" stroke="#111" stroke-width="1.6" marker-end="url(#ah)"/>
<path d="M490,225 L550,225" fill="none" stroke="#111" stroke-width="1.6" marker-end="url(#ah)"/>
<path d="M760,225 L830,225" fill="none" stroke="#111" stroke-width="1.6" marker-end="url(#ah)"/>
<path d="M915,270 L915,420" fill="none" stroke="#111" stroke-width="1.6" marker-end="url(#ah)"/>
<path d="M140,270 L140,545 L855,545 L855,480" fill="none" stroke="#111" stroke-width="1.6" marker-end="url(#ah)"/>
<path d="M815,450 L760,450" fill="none" stroke="#111" stroke-width="1.6" marker-end="url(#ah)"/>
<path d="M550,450 L500,450" fill="none" stroke="#111" stroke-width="1.6" marker-end="url(#ah)"/>
<path d="M330,420 L330,330 L700,330 L700,255" fill="none" stroke="#D7592F" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ar)"/>
<path d="M955,480 L955,600" fill="none" stroke="#111" stroke-width="1.6" marker-end="url(#ah)"/>
</g>
<g id="nodes">
