<text x="815.0" y="424.2" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="bold">4</text>
<circle cx="550" cy="420" r="11" fill="#111"/>
<text x="550.0" y="424.2" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="bold">5</text>
<circle cx="270" cy="420" r="11" fill="#111"/>
<text x="270.0" y="424.2" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="bold">6</text>
<rect x="389.9" y="339.0" width="250.2" height="17.0" rx="3" fill="#FFFEF9" fill-opacity="0.92"/>
<text x="515.0" y="352.0" font-size="13" fill="#D7592F" text-anchor="middle" font-weight="bold">dev only: tune prompt, floor, synonyms</text>
<rect x="962.0" y="522.0" width="66.0" height="33.0" rx="3" fill="#FFFEF9" fill-opacity="0.92"/>
<text x="965.0" y="535.0" font-size="13" fill="#222" text-anchor="start" font-weight="bold">Hard Line</text>
<text x="965.0" y="551.0" font-size="13" fill="#222" text-anchor="start" font-weight="bold">broken</text>
</g>
</svg>
