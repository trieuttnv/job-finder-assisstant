<path d="M824,114 L862,114" stroke="#D7592F" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ar)"/>
<text x="874" y="118.5" font-size="13" fill="#222">loop / feedback</text>
<circle cx="843.0" cy="140" r="10" fill="#111"/>
<text x="843.0" y="144.2" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="874" y="144.5" font-size="13" fill="#222">step number</text>
<circle cx="300" cy="195" r="11" fill="#111"/>
<text x="300.0" y="199.2" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="bold">1</text>
<circle cx="550" cy="195" r="11" fill="#111"/>
