<text x="395.0" y="221.4" font-size="14" fill="#111" text-anchor="middle" font-weight="bold">eval runner</text>
<text x="395.0" y="238.4" font-size="14" fill="#111" text-anchor="middle" font-weight="bold">per provider · N reps</text>
<rect x="550" y="195" width="210" height="60" rx="8" fill="#FFC233" stroke="#333" stroke-width="1" filter="url(#sh)"/>
<text x="655.0" y="221.4" font-size="14" fill="#111" text-anchor="middle" font-weight="bold">Ask use case</text>
<text x="655.0" y="238.4" font-size="14" fill="#111" text-anchor="middle" font-weight="bold">(same path as the CLI)</text>
<path d="M830,200 a85.0,10 0 0 1 170,0 v60 a85.0,10 0 0 1 -170,0 z" fill="#DEDEDE" stroke="#666" stroke-width="1" filter="url(#sh)"/>
<path d="M830,200 a85.0,10 0 0 0 170,0" fill="none" stroke="#666" stroke-width="1"/>
<text x="915.0" y="238.9" font-size="14" fill="#111" text-anchor="middle" font-weight="bold">traces JSONL</text>
<rect x="815" y="420" width="200" height="60" rx="8" fill="#EE9A9A" stroke="#333" stroke-width="1" filter="url(#sh)"/>
<text x="915.0" y="446.4" font-size="14" fill="#111" text-anchor="middle" font-weight="bold">code scorer</text>
<text x="915.0" y="463.4" font-size="14" fill="#111" text-anchor="middle" font-weight="bold">10 metrics</text>
<rect x="550" y="420" width="210" height="60" rx="8" fill="#DCEDC8" stroke="#333" stroke-width="1" filter="url(#sh)"/>
<text x="655.0" y="446.4" font-size="14" fill="#111" text-anchor="middle" font-weight="bold">table + results/</text>
<text x="655.0" y="463.4" font-size="14" fill="#111" text-anchor="middle" font-weight="bold">config · commit</text>
<rect x="270" y="420" width="230" height="60" rx="8" fill="#DCEDC8" stroke="#333" stroke-width="1" filter="url(#sh)"/>
<text x="385.0" y="446.4" font-size="14" fill="#111" text-anchor="middle" font-weight="bold">error analysis</text>
<text x="385.0" y="463.4" font-size="14" fill="#111" text-anchor="middle" font-weight="bold">Subject tags each failure</text>
<rect x="815" y="600" width="200" height="60" rx="8" fill="#EE9A9A" stroke="#333" stroke-width="1" filter="url(#sh)"/>
<text x="915.0" y="626.4" font-size="14" fill="#111" text-anchor="middle" font-weight="bold">exit ≠ 0</text>
<text x="915.0" y="643.4" font-size="14" fill="#111" text-anchor="middle" font-weight="bold">(blocks canary)</text>
</g>
<g id="labels">
<rect x="810" y="66" width="168" height="96" rx="10" fill="#FFFFFF" stroke="#999"/>
<path d="M824,88 L862,88" stroke="#111" stroke-width="1.6" marker-end="url(#ah)"/>
