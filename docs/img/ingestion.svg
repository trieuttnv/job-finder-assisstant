<text x="388.0" y="544.2" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="bold">7</text>
<circle cx="562" cy="540" r="11" fill="#111"/>
<text x="562.0" y="544.2" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="bold">8</text>
<circle cx="736" cy="540" r="11" fill="#111"/>
<text x="736.0" y="544.2" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="bold">9</text>
<circle cx="910" cy="540" r="11" fill="#111"/>
<text x="910.0" y="544.2" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="bold">10</text>
<rect x="965.0" y="385.0" width="89.1" height="33.0" rx="3" fill="#FFFEF9" fill-opacity="0.92"/>
