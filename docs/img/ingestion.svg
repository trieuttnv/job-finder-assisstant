<text x="115.0" y="572.9" font-size="14" fill="#111" text-anchor="middle" font-weight="bold">Normalise</text>
<rect x="214" y="540" width="150" height="56" rx="8" fill="#EE9A9A" stroke="#333" stroke-width="1" filter="url(#sh)"/>
<text x="289.0" y="572.9" font-size="14" fill="#111" text-anchor="middle" font-weight="bold">Validate</text>
<rect x="388" y="540" width="150" height="56" rx="8" fill="#FFC233" stroke="#333" stroke-width="1" filter="url(#sh)"/>
<text x="463.0" y="572.9" font-size="14" fill="#111" text-anchor="middle" font-weight="bold">Provenance</text>
<rect x="562" y="540" width="150" height="56" rx="8" fill="#FFC233" stroke="#333" stroke-width="1" filter="url(#sh)"/>
<text x="637.0" y="572.9" font-size="14" fill="#111" text-anchor="middle" font-weight="bold">Diff</text>
<rect x="736" y="540" width="150" height="56" rx="8" fill="#DCEDC8" stroke="#333" stroke-width="1" filter="url(#sh)"/>
<text x="811.0" y="564.4" font-size="14" fill="#111" text-anchor="middle" font-weight="bold">Review /</text>
<text x="811.0" y="581.4" font-size="14" fill="#111" text-anchor="middle" font-weight="bold">Quarantine</text>
<rect x="910" y="540" width="150" height="56" rx="8" fill="#FFC233" stroke="#333" stroke-width="1" filter="url(#sh)"/>
<text x="985.0" y="572.9" font-size="14" fill="#111" text-anchor="middle" font-weight="bold">Publish</text>
<path d="M620,390 a75.0,10 0 0 1 150,0 v50 a75.0,10 0 0 1 -150,0 z" fill="#DEDEDE" stroke="#666" stroke-width="1" filter="url(#sh)"/>
<path d="M620,390 a75.0,10 0 0 0 150,0" fill="none" stroke="#666" stroke-width="1"/>
