<rect x="35" y="274" width="165" height="36" rx="8" fill="#FFFFFF" stroke="#666" stroke-width="1.2" stroke-dasharray="5 5"/>
<text x="117.5" y="296.9" font-size="14" fill="#555" text-anchor="middle" font-weight="bold">Database</text>
<rect x="35" y="322" width="165" height="36" rx="8" fill="#FFFFFF" stroke="#666" stroke-width="1.2" stroke-dasharray="5 5"/>
<text x="117.5" y="344.9" font-size="14" fill="#555" text-anchor="middle" font-weight="bold">Website</text>
<rect x="255" y="270" width="140" height="56" rx="8" fill="#FFC233" stroke="#333" stroke-width="1" filter="url(#sh)"/>
<text x="325.0" y="302.9" font-size="14" fill="#111" text-anchor="middle" font-weight="bold">Discover</text>
<rect x="435" y="270" width="140" height="56" rx="8" fill="#FFC233" stroke="#333" stroke-width="1" filter="url(#sh)"/>
<text x="505.0" y="302.9" font-size="14" fill="#111" text-anchor="middle" font-weight="bold">Fetch</text>
<rect x="615" y="270" width="160" height="56" rx="8" fill="#FFC233" stroke="#333" stroke-width="1" filter="url(#sh)"/>
<text x="695.0" y="294.4" font-size="14" fill="#111" text-anchor="middle" font-weight="bold">Snapshot</text>
<text x="695.0" y="311.4" font-size="14" fill="#111" text-anchor="middle" font-weight="bold">redact · hash</text>
