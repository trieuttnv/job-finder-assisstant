<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 790" width="1100" height="790" font-family="Helvetica, Arial, sans-serif">
<title>Ingestion pipeline: ten stages</title>
<defs>
<filter id="sh" x="-10%" y="-10%" width="130%" height="140%"><feDropShadow dx="2" dy="2" stdDeviation="1.5" flood-opacity=".25"/></filter>
<marker id="ah" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#888"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#D7592F"/></marker>
</defs>
<rect x="1.5" y="1.5" width="1097" height="787" fill="#FFFEF9" stroke="#D4A017" stroke-width="3"/>
<text x="550.0" y="52" font-size="30" font-weight="bold" fill="#111" text-anchor="middle">Ingestion pipeline: ten stages</text>
<g id="zones">
<rect x="20" y="90" width="195" height="290" rx="16" fill="#F4E5F8" stroke="#333" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="117.5" y="114.0" font-size="16" fill="#111" text-anchor="middle" font-weight="bold">Sources</text>
<rect x="235" y="230" width="795" height="120" rx="16" fill="#FFF2CC" stroke="#333" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="632.5" y="254.0" font-size="16" fill="#111" text-anchor="middle" font-weight="bold">Source Connector (per kind of Source)</text>
<rect x="20" y="500" width="1060" height="116" rx="16" fill="#FBE4EC" stroke="#333" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="550.0" y="524.0" font-size="16" fill="#111" text-anchor="middle" font-weight="bold">Shared stages</text>
</g>
<g id="edges">
<path d="M215,298 L255,298" fill="none" stroke="#111" stroke-width="1.6" marker-end="url(#ah)"/>
<path d="M395,298 L435,298" fill="none" stroke="#111" stroke-width="1.6" marker-end="url(#ah)"/>
<path d="M575,298 L615,298" fill="none" stroke="#111" stroke-width="1.6" marker-end="url(#ah)"/>
<path d="M775,298 L815,298" fill="none" stroke="#111" stroke-width="1.6" marker-end="url(#ah)"/>
<path d="M190,568 L214,568" fill="none" stroke="#111" stroke-width="1.6" marker-end="url(#ah)"/>
<path d="M364,568 L388,568" fill="none" stroke="#111" stroke-width="1.6" marker-end="url(#ah)"/>
<path d="M538,568 L562,568" fill="none" stroke="#111" stroke-width="1.6" marker-end="url(#ah)"/>
<path d="M712,568 L736,568" fill="none" stroke="#111" stroke-width="1.6" marker-end="url(#ah)"/>
<path d="M886,568 L910,568" fill="none" stroke="#111" stroke-width="1.6" marker-end="url(#ah)"/>
<path d="M695,326 L695,380" fill="none" stroke="#111" stroke-width="1.6" marker-end="url(#ah)"/>
<path d="M850,326 L850,485 L115,485 L115,540" fill="none" stroke="#111" stroke-width="1.6" marker-end="url(#ah)"/>
<path d="M870,540 L870,465 L960,465 L960,326" fill="none" stroke="#D7592F" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ar)"/>
<path d="M289,596 L289,670" fill="none" stroke="#888" stroke-width="1.6" stroke-dasharray="2 4" marker-end="url(#ag)"/>
<path d="M985,596 L985,670" fill="none" stroke="#111" stroke-width="1.6" marker-end="url(#ah)"/>
<path d="M870,712 L740,712" fill="none" stroke="#111" stroke-width="1.6" marker-end="url(#ah)"/>
</g>
<g id="nodes">
<rect x="35" y="130" width="165" height="36" rx="8" fill="#CB94D7" stroke="#333" stroke-width="1" filter="url(#sh)"/>
<text x="117.5" y="152.9" font-size="14" fill="#111" text-anchor="middle" font-weight="bold">CV (PDF)</text>
<rect x="35" y="178" width="165" height="36" rx="8" fill="#CB94D7" stroke="#333" stroke-width="1" filter="url(#sh)"/>
<text x="117.5" y="200.9" font-size="14" fill="#111" text-anchor="middle" font-weight="bold">Learning repo (Git)</text>
<rect x="35" y="226" width="165" height="36" rx="8" fill="#FFFFFF" stroke="#666" stroke-width="1.2" stroke-dasharray="5 5"/>
