<text x="695.0" y="432.4" font-size="14" fill="#111" text-anchor="middle" font-weight="bold">immutable</text>
<path d="M214,680 a75.0,10 0 0 1 150,0 v44 a75.0,10 0 0 1 -150,0 z" fill="#DEDEDE" stroke="#666" stroke-width="1" filter="url(#sh)"/>
<path d="M214,680 a75.0,10 0 0 0 150,0" fill="none" stroke="#666" stroke-width="1"/>
<text x="289.0" y="710.9" font-size="14" fill="#111" text-anchor="middle" font-weight="bold">quarantine/</text>
<path d="M870,680 a107.0,10 0 0 1 214,0 v64 a107.0,10 0 0 1 -214,0 z" fill="#DEDEDE" stroke="#666" stroke-width="1" filter="url(#sh)"/>
<path d="M870,680 a107.0,10 0 0 0 214,0" fill="none" stroke="#666" stroke-width="1"/>
<text x="977.0" y="712.5" font-size="13" fill="#111" text-anchor="middle" font-weight="bold">entries/ + releases/</text>
<text x="977.0" y="728.5" font-size="13" fill="#111" text-anchor="middle" font-weight="bold">git tag knowledge-version</text>
<rect x="580" y="687" width="160" height="50" rx="8" fill="#FFC233" stroke="#333" stroke-width="1" filter="url(#sh)"/>
<text x="660.0" y="716.9" font-size="14" fill="#111" text-anchor="middle" font-weight="bold">Ask service</text>
