<text x="815.0" y="274.2" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="bold">4</text>
<circle cx="40" cy="540" r="11" fill="#111"/>
<text x="40.0" y="544.2" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="bold">5</text>
<circle cx="214" cy="540" r="11" fill="#111"/>
<text x="214.0" y="544.2" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="bold">6</text>
